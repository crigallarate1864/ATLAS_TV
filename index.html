<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ATLAS 118 · Equipaggi diurni</title>
  <style>
    :root{
      color-scheme:dark;
      --bg:#06131d;
      --panel:#0b2230;
      --panel2:#0e2c3d;
      --line:rgba(129,190,216,.16);
      --text:#f4fbff;
      --muted:#83a9ba;
      --red:#e3273e;
      --cyan:#47c8ed;
      --green:#43d6a1;
      --yellow:#efbd56;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text)}
    body{
      background:
        radial-gradient(circle at 10% 15%,rgba(71,200,237,.08),transparent 32%),
        radial-gradient(circle at 90% 85%,rgba(227,39,62,.08),transparent 36%),
        var(--bg);
    }
    .screen{height:100%;display:grid;grid-template-rows:142px 1fr 48px;padding:28px 38px 22px;gap:20px}
    .top{
      display:grid;
      grid-template-columns:1fr auto;
      align-items:center;
      border-bottom:1px solid var(--line);
      padding-bottom:20px;
    }
    .brand-kicker{font-size:18px;font-weight:850;letter-spacing:.16em;color:var(--red)}
    .brand-title{margin-top:8px;font-size:42px;font-weight:900;letter-spacing:.025em}
    .date{text-align:right}
    .date-day{font-size:18px;font-weight:850;letter-spacing:.12em;color:var(--cyan);text-transform:uppercase}
    .date-main{margin-top:7px;font-size:32px;font-weight:850}
    .clock{margin-top:4px;font-size:18px;color:var(--muted)}
    .shifts{min-height:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
    .shift{
      min-width:0;
      display:grid;
      grid-template-rows:auto 1fr;
      border:1px solid var(--line);
      border-radius:22px;
      background:linear-gradient(160deg,rgba(14,44,61,.96),rgba(7,27,39,.96));
      overflow:hidden;
      box-shadow:0 22px 45px rgba(0,0,0,.28);
    }
    .shift.current{border-color:rgba(71,200,237,.55);box-shadow:0 0 0 1px rgba(71,200,237,.14),0 25px 55px rgba(0,0,0,.34)}
    .shift-head{
      padding:19px 22px 17px;
      border-bottom:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:flex-end;gap:12px
    }
    .shift-name{font-size:27px;font-weight:950;letter-spacing:.04em}
    .shift-time{font-size:15px;font-weight:750;color:var(--muted)}
    .crew-grid{min-height:0;padding:17px;display:grid;gap:13px;align-content:start;overflow:hidden}
    .crew{
      border:1px solid rgba(129,190,216,.13);
      border-radius:16px;
      background:rgba(4,18,27,.36);
      padding:14px 16px;
    }
    .crew-title{font-size:14px;font-weight:900;letter-spacing:.1em;color:var(--cyan);text-transform:uppercase}
    .names{display:grid;gap:7px;margin-top:11px}
    .person{
      min-height:38px;
      display:flex;align-items:center;
      padding:7px 12px;
      border-radius:10px;
      background:rgba(255,255,255,.035);
      font-size:23px;font-weight:820;letter-spacing:.015em
    }
    .person.vacant{color:#ff8d9c;border:1px dashed rgba(227,39,62,.4);background:rgba(227,39,62,.055)}
    .empty{
      min-height:160px;
      display:grid;place-items:center;
      color:var(--muted);
      font-size:20px;font-weight:750;
      text-align:center;
    }
    .footer{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
    .status{display:flex;align-items:center;gap:8px}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 14px rgba(67,214,161,.75)}
    .dot.error{background:var(--red);box-shadow:0 0 14px rgba(227,39,62,.65)}
    .version{font-weight:800;letter-spacing:.08em}
    @media(max-width:1100px){
      .screen{padding:20px;grid-template-rows:115px 1fr 40px}
      .brand-title{font-size:31px}
      .date-main{font-size:24px}
      .shifts{gap:12px}
      .person{font-size:17px}
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="top">
      <div>
        <div class="brand-kicker">ATLAS 118</div>
        <div class="brand-title">EQUIPAGGI DIURNI</div>
      </div>
      <div class="date">
        <div class="date-day" id="dateDay">—</div>
        <div class="date-main" id="dateMain">—</div>
        <div class="clock" id="clock">--:--</div>
      </div>
    </header>

    <section class="shifts" id="shifts"></section>

    <footer class="footer">
      <div class="status"><span class="dot" id="dot"></span><span id="status">Connessione al server in corso…</span></div>
      <div class="version">ATLAS TV · EQUIPAGGI DIURNI · SOLA LETTURA</div>
    </footer>
  </main>

  <script>
  (() => {
    'use strict';

    const SERVER_URL =
      'https://script.google.com/macros/s/AKfycbwC6wNURko6ZZeK7yRW9yePVe-366JrH4BGQN38FY-HObBRWPK6FbBOeQmGJ37wSCXq/exec';
    const REFRESH_SECONDS = 60;
    const KEY_STORAGE = 'atlas-tv-display-key-v2';
    const CACHE_STORAGE = 'atlas-tv-today-cache-v3';
    const query = new URLSearchParams(location.search);

    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? '').replace(
      /[&<>"']/g,
      char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#039;'
      }[char])
    );
    const pad = value => String(value).padStart(2,'0');
    const isoDay = date =>
      `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;

    const DISPLAY_KEY = (
      query.get('key') ||
      query.get('displayKey') ||
      localStorage.getItem(KEY_STORAGE) ||
      ''
    ).trim();

    if(DISPLAY_KEY){
      localStorage.setItem(KEY_STORAGE, DISPLAY_KEY);
    }

    const state = {
      day: isoDay(new Date()),
      assignments: [],
      source: 'loading',
      updatedAt: null,
      errorMessage: ''
    };

    const shifts = [
      {id:'M',name:'MATTINA',time:'06:00 — 13:30'},
      {id:'P',name:'POMERIGGIO',time:'13:00 — 20:30'}
    ];

    function expectedCrews(shift, day){
      const date = new Date(`${day}T00:00:00`);
      const saturday = date.getDay() === 6;

      if(shift === 'P' && saturday){
        return [
          {site:'G',machine:'2',label:'Gallarate · Mezzo 2',roles:['A','C']},
          {site:'S',machine:'3',label:'Somma Lombardo',roles:['A','C','S']}
        ];
      }

      return [
        {site:'G',machine:'2',label:'Gallarate · Mezzo 2',roles:['A','C']},
        {site:'G',machine:'3',label:'Gallarate · Mezzo 3',roles:['A','C','S']},
        {site:'S',machine:'3',label:'Somma Lombardo',roles:['A','C','S']}
      ];
    }

    function currentShift(){
      const now = new Date();
      const minutes = now.getHours()*60 + now.getMinutes();

      if(
        minutes >= 6*60 &&
        minutes < 13*60+30
      ) return 'M';

      if(
        minutes >= 13*60+30 &&
        minutes < 20*60+30
      ) return 'P';

      return '';
    }

    function roleOrder(role){
      return ({A:0,C:1,S:2})[role] ?? 9;
    }

    function render(){
      const now = new Date();
      const date = new Date(`${state.day}T00:00:00`);
      $('#dateDay').textContent = date.toLocaleDateString(
        'it-IT',
        {weekday:'long'}
      );
      $('#dateMain').textContent = date.toLocaleDateString(
        'it-IT',
        {day:'2-digit',month:'long',year:'numeric'}
      );
      $('#clock').textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}`;

      const active = currentShift();

      $('#shifts').innerHTML = shifts.map(shift => {
        const records = state.assignments.filter(
          item => item.shift === shift.id
        );

        const crews = expectedCrews(
          shift.id,
          state.day
        );

        const crewHtml = crews.map(crew => {
          const names = records
            .filter(item =>
              item.site === crew.site &&
              String(item.machine || '3') === crew.machine
            )
            .sort((a,b) =>
              roleOrder(a.role)-roleOrder(b.role)
            );

          const people = crew.roles.map(role => {
            const record = names.find(
              item => item.role === role
            );
            return record
              ?`<div class="person">${esc(record.displayName)}</div>`
              :`<div class="person vacant">DA COPRIRE</div>`;
          }).join('');

          return `
            <article class="crew">
              <div class="crew-title">${esc(crew.label)}</div>
              <div class="names">${people}</div>
            </article>
          `;
        }).join('');

        return `
          <section class="shift ${active===shift.id?'current':''}">
            <header class="shift-head">
              <div class="shift-name">${shift.name}</div>
              <div class="shift-time">${shift.time}</div>
            </header>
            <div class="crew-grid">
              ${crewHtml || '<div class="empty">Nessun equipaggio registrato</div>'}
            </div>
          </section>
        `;
      }).join('');

      const dot = $('#dot');
      dot.className =
        'dot' + (state.source === 'server' ? '' : ' error');

      if(state.source === 'server'){
        $('#status').textContent =
          `Aggiornato alle ${state.updatedAt?.toLocaleTimeString(
            'it-IT',
            {hour:'2-digit',minute:'2-digit'}
          ) || '--:--'}`;
      }else if(state.source === 'cache'){
        $('#status').textContent =
          `Ultimi dati memorizzati · ${state.errorMessage || 'server non raggiungibile'}`;
      }else if(state.source === 'key'){
        $('#status').textContent =
          'CHIAVE TV MANCANTE · aggiungere ?key=... all’URL Yodeck';
      }else{
        $('#status').textContent =
          state.errorMessage || 'Connessione al server in corso…';
      }
    }

    async function load(){
      if(DISPLAY_KEY.length < 32){
        state.source = 'key';
        state.errorMessage =
          'Chiave TV mancante nell’URL Yodeck.';
        throw new Error(state.errorMessage);
      }

      const controller = new AbortController();
      const timer = setTimeout(
        () => controller.abort(),
        30000
      );

      try{
        const response = await fetch(
          SERVER_URL,
          {
            method:'POST',
            headers:{
              'Content-Type':
                'text/plain;charset=utf-8'
            },
            body:JSON.stringify({
              action:'tvToday',
              displayKey:DISPLAY_KEY,
              day:state.day
            }),
            redirect:'follow',
            signal:controller.signal
          }
        );

        const raw = await response.text();
        let data;

        try{
          data = JSON.parse(raw);
        }catch{
          throw new Error(
            'Risposta server non valida.'
          );
        }

        if(!response.ok || !data.ok){
          throw new Error(
            data.error ||
            `Errore HTTP ${response.status}`
          );
        }

        state.assignments =
          Array.isArray(data.assignments)
            ?data.assignments
            :[];
        state.updatedAt = new Date();
        state.source = 'server';
        state.errorMessage = '';

        localStorage.setItem(
          CACHE_STORAGE,
          JSON.stringify({
            day:state.day,
            assignments:state.assignments,
            updatedAt:
              state.updatedAt.toISOString()
          })
        );
      }finally{
        clearTimeout(timer);
      }
    }

    function loadCache(){
      try{
        const cache = JSON.parse(
          localStorage.getItem(CACHE_STORAGE) ||
          'null'
        );

        if(
          !cache ||
          cache.day !== state.day ||
          !Array.isArray(cache.assignments)
        ) return false;

        state.assignments = cache.assignments;
        state.updatedAt =
          new Date(cache.updatedAt);
        state.source = 'cache';
        return true;
      }catch{
        return false;
      }
    }

    async function refresh(){
      try{
        await load();
      }catch(error){
        const message =
          error?.name === 'AbortError'
            ?'timeout collegamento Apps Script'
            :String(
                error?.message ||
                'server non raggiungibile'
              );

        state.errorMessage = message;

        if(state.source !== 'key'){
          state.source = loadCache()
            ?'cache'
            :'error';
        }

        console.error(
          '[ATLAS TV]',
          message
        );
      }

      render();
    }

    setInterval(() => {
      const today = isoDay(new Date());
      if(today !== state.day){
        state.day = today;
      }
      render();
    }, 1000);

    setInterval(refresh, REFRESH_SECONDS*1000);
    refresh();
  })();
  </script>
</body>
</html>
