<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>ATLAS 118 · Equipaggi</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071117;font-family:Inter,Segoe UI,Arial,sans-serif}
    .loading{position:fixed;inset:0;display:grid;place-items:center;background:#071117;color:#8aa0aa;z-index:2;transition:opacity .25s ease}
    .loading.hide{opacity:0;pointer-events:none}
    .loading-card{display:flex;align-items:center;gap:12px;padding:14px 18px;border:1px solid #203842;border-radius:14px;background:#0b1b24}
    .dot{width:9px;height:9px;border-radius:50%;background:#5bc69a;box-shadow:0 0 14px rgba(91,198,154,.35);animation:pulse 1.3s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.35}}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#071117}
  </style>
</head>
<body>
  <div class="loading" id="loading"><div class="loading-card"><i class="dot"></i><span>Caricamento equipaggi ATLAS…</span></div></div>
  <iframe
    id="atlasTvFrame"
    title="ATLAS 118 · Equipaggi"
    src="https://script.google.com/macros/s/AKfycbzQv_9pxwVhbjLJuKysh0a52G5BBaGxzKuD38ky4Uigr3YQpG09yBr2pdIrz9gmUnYG/exec?action=tv"
    allow="fullscreen"
    referrerpolicy="no-referrer">
  </iframe>
  <script>
    const frame=document.getElementById('atlasTvFrame');
    const loading=document.getElementById('loading');
    frame.addEventListener('load',()=>loading.classList.add('hide'));
  </script>
</body>
</html>
